name: ai_english_coach
description: A modern AI-powered English learning application.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0
  go_router: ^12.0.0
  google_fonts: ^6.1.0
  http: ^1.1.0
  web_socket_channel: ^2.4.0
  shared_preferences: ^2.2.0
  intl: ^0.18.1
  flutter_svg: ^2.0.7
  cached_network_image: ^3.3.0
  lottie: ^2.7.0
  fl_chart: ^0.65.0
  percent_indicator: ^4.2.3
  record: ^5.0.0
  audioplayers: ^5.2.1
  flutter_tts: ^3.8.3
  animate_do: ^3.0.2
  loading_animation_widget: ^1.2.0
  confetti: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.6
  riverpod_generator: ^2.3.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
