services:
  - type: web
    name: ai-english-coach-backend
    env: docker
    region: singapore
    plan: free
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-coach-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ai-coach-redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
    
  - type: redis
    name: ai-coach-redis
    plan: free
    region: singapore
    
databases:
  - name: ai-coach-db
    plan: free
    region: singapore
    databaseName: ai_coach
    user: admin
