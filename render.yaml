services:
  - type: web
    name: ai-english-coach-backend
    env: docker
    region: singapore
    plan: free
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    envVars:
      # DATABASE_URL: Cấu hình thủ công trên Render Dashboard
      # Dùng Neon.tech (free forever): https://neon.tech
      # Sau khi tạo DB trên Neon, paste connection string vào Render > Environment > DATABASE_URL
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: ai-coach-redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: redis
    name: ai-coach-redis
    plan: free
    region: singapore
    ipAllowList: []

# NOTE: Render free PostgreSQL đã hết hạn (90 ngày).
# Sử dụng Neon.tech (https://neon.tech) - PostgreSQL miễn phí mãi mãi.
# Tạo DB trên Neon → copy Connection String → paste vào Render Dashboard > Environment > DATABASE_URL
