apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-coach-ingress
  namespace: ai-coach-prod
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "ai-coach-static-ip"
spec:
  rules:
    - host: ai-coach.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
