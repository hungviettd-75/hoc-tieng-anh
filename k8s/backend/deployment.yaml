apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ai-coach-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: gcr.io/your-project-id/ai-coach-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ai-coach-config
            - secretRef:
                name: ai-coach-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
