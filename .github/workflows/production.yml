name: Production Deployment (GCP GKE)

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER: ai-coach-cluster
  GKE_ZONE: us-central1-a
  BACKEND_IMAGE: gcr.io/${{ secrets.GCP_PROJECT_ID }}/ai-coach-backend
  FRONTEND_IMAGE: gcr.io/${{ secrets.GCP_PROJECT_ID }}/ai-coach-frontend

jobs:
  setup-build-publish-deploy:
    name: Setup, Build, Publish, and Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    # Setup gcloud CLI
    - id: 'auth'
      uses: 'google-github-actions/auth@v1'
      with:
        credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

    - name: 'Set up Cloud SDK'
      uses: 'google-github-actions/setup-gcloud@v1'

    - name: 'Use gcloud CLI'
      run: 'gcloud info'

    # Configure Docker to use the gcloud command-line tool as a credential
    # helper for authentication
    - run: |-
        gcloud --quiet auth configure-docker

    # Get the GKE credentials so we can deploy to the cluster
    - uses: google-github-actions/get-gke-credentials@v1
      with:
        cluster_name: ${{ env.GKE_CLUSTER }}
        location: ${{ env.GKE_ZONE }}

    # Build the Docker image
    - name: Build Backend
      run: |-
        docker build \
          --tag "$BACKEND_IMAGE:$GITHUB_SHA" \
          --build-arg GITHUB_SHA="$GITHUB_SHA" \
          --build-arg GITHUB_REF="$GITHUB_REF" \
          ./backend

    - name: Build Frontend
      run: |-
        docker build \
          --tag "$FRONTEND_IMAGE:$GITHUB_SHA" \
          --build-arg GITHUB_SHA="$GITHUB_SHA" \
          --build-arg GITHUB_REF="$GITHUB_REF" \
          ./frontend

    # Push the Docker image to Google Container Registry
    - name: Publish Backend
      run: |-
        docker push "$BACKEND_IMAGE:$GITHUB_SHA"

    - name: Publish Frontend
      run: |-
        docker push "$FRONTEND_IMAGE:$GITHUB_SHA"

    # Set up kustomize
    - name: Set up Kustomize
      run: |-
        curl -sfLo kustomize https://github.com/kubernetes-sigs/kustomize/releases/download/v3.1.0/kustomize_3.1.0_linux_amd64
        chmod u+x ./kustomize

    # Deploy the Docker image to the GKE cluster
    - name: Deploy
      run: |-
        # Update image tags
        sed -i 's|gcr.io/your-project-id/ai-coach-backend:latest|'"$BACKEND_IMAGE:$GITHUB_SHA"'|g' k8s/backend/deployment.yaml
        sed -i 's|gcr.io/your-project-id/ai-coach-backend:latest|'"$BACKEND_IMAGE:$GITHUB_SHA"'|g' k8s/celery-worker/deployment.yaml
        sed -i 's|gcr.io/your-project-id/ai-coach-frontend:latest|'"$FRONTEND_IMAGE:$GITHUB_SHA"'|g' k8s/frontend/deployment.yaml

        # Apply manifests
        kubectl apply -f k8s/base/namespace.yaml
        kubectl apply -f k8s/base/configmap.yaml
        kubectl apply -f k8s/backend/
        kubectl apply -f k8s/frontend/
        kubectl apply -f k8s/celery-worker/
        kubectl apply -f k8s/ingress.yaml
        
        # Monitor rollout status
        kubectl rollout status deployment/backend -n ai-coach-prod
        kubectl rollout status deployment/frontend -n ai-coach-prod
        kubectl rollout status deployment/celery-worker -n ai-coach-prod
